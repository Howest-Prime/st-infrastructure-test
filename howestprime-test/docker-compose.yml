
services:
  movies-db.howestprime.test: 
    image: postgres:16
    container_name: movies-db.howestprime-test
    restart: unless-stopped
    env_file:
    - ./.movies-db.howestprime.test.env
    volumes:
    - movies-db-data-test:/var/lib/postgresql/data
    ports:
    - "40221:5000"
    networks:
     - howestprime-test
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1  
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
  ticketing-db.howestprime.test:
    image: mongo:7
    container_name: ticketing-db.howestprime-test
    restart: unless-stopped
    env_file:
      - ./.ticketing-db.howestprime.test.env
    ports:
      - "40231:5000"
    volumes:
      - ticketing-db-data-test:/data/db
    networks:
      - howestprime-test
    command: >
      bash -c "
        mongod --port 5000 --replSet rs0 --bind_ip_all &
        until mongosh --port 5000 --eval 'print(\"waited for connection\")'
        do
          sleep 1
        done
        mongosh --port 5000 --eval 'rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"ticketing-db.howestprime.test:5000\" }] })'
        wait
      "
    healthcheck:
      test: ["CMD-SHELL", "mongosh --port 5000 --eval 'db.adminCommand(\"ping\")'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

  messagebroker.howestprime.test:
    image: cloudamqp/lavinmq:2.7.1
    container_name: messagebroker.howestprime-test
    restart: unless-stopped
    ports:
    - "40200:5672"
    - "40201:15672"
    networks:
     - howestprime-test
    healthcheck:
      test: ["CMD-SHELL", "lavinmqctl status | grep -q 'Uptime: ' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

  movies.howestprime.test:
    image: howestprime-movies:latest
    restart: unless-stopped
    ports:
      - "40220:8000"
    container_name: howestprime-movies.test
    env_file:
      - ./.movies.howestprime.test.env
    volumes:
      - ../../st-microservice-movies-sumanadhikari-howest-1/config:/config
    depends_on:
      movies-db.howestprime.test:
        condition: service_healthy
      messagebroker.howestprime.test:
        condition: service_healthy
    networks:
      - howestprime-test

  backoffice.howestprime.test:
    image: howestprime-client-backoffice:latest
    restart: unless-stopped
    ports:
      - 10210:8080
    container_name: backoffice.howestprime.test
    env_file:
      - ./.client-backoffice.howestprime.test.env
    depends_on:
      movies.howestprime.test:
        condition: service_started
    networks:
      - howestprime-test


  ticketing.howestprime.test:
    container_name: ticketing.howestprime.test
    image: howestprime-ticketing:latest
    restart: unless-stopped
    ports:
      - 40230:8000
    env_file:
      - ./.ticketing.howestprime.test.env
    depends_on:
      ticketing-db.howestprime.test:
        condition: service_healthy
      messagebroker.howestprime.test:
        condition: service_healthy
    networks:
      - howestprime-test
  webapp.howestprime.test:
    image: hcr.technet.howest.be/howestprime-client-webapp:latest
    restart: unless-stopped
    ports:
      - 10200:80
    container_name: webapp.howestprime.test
    env_file:
      - ./.client-webapp.howestprime.test.env
    depends_on:
      movies.howestprime.test:
        condition: service_started
      ticketing.howestprime.test:
        condition: service_started
    networks:
      - howestprime-test

networks:
  howestprime-test:
    name: howestprime-test
    ipam:
      config:
        - subnet: 10.22.0.0/16

volumes:
  movies-db-data-test:
    name: movies-db-data-test
  ticketing-db-data-test:
    name: ticketing-db-data-test